
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header Section -->
    <header>
        <div>
            <h1>My To-Do List</h1>
            <p>Organise your day and get things done!</p>
        </div>
    </header>

    <main>

        <!-- Add New Task Section -->
        <section>
            <h2>Add a New Task</h2>

            <div class="add-task">

                <label for="task">Enter your task</label>

                <br>

                <input
                    type="text"
                    id="task"
                    placeholder="What do you need to do?"
                >

                <button type="button" id="addTaskBtn">
                    Add Task
                </button>

            </div>
        </section>

        <!-- Task List Section -->
        <section>
            <h2>Your Task List</h2>

            <!-- Tasks will be added here using JavaScript -->
            <ul id="taskList">
            </ul>

        </section>

        <!-- Task Summary Section -->
        <section>
            <h2>Task Summary</h2>

            <div class="summary">

                <p>
                    Total Tasks:
                    <strong id="totalTasks">0</strong>
                </p>

                <p>
                    Completed Tasks:
                    <strong id="completedTasks">0</strong>
                </p>

                <p>
                    Pending Tasks:
                    <strong id="pendingTasks">0</strong>
                </p>

            </div>
        </section>

    </main>

    <!-- Footer Section -->
    <footer>
        Made with love by Priscilla
    </footer>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
